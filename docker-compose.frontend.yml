# Helali public site — GHCR image only (no on-server build).
# Host publish: FRONTEND_HOST_PORT (default 3031) → container 3000

services:
  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: helali-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://helali.rmhosseini.ir/api/v1}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://helali.rmhosseini.ir}
      API_URL: ${API_URL:-http://helali-backend:4000/api/v1}
      BACKEND_INTERNAL_ORIGIN: ${BACKEND_INTERNAL_ORIGIN:-http://helali-backend:4000}
      MINIO_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-5.159.49.36}
      MINIO_PORT: ${MINIO_PUBLIC_PORT:-9010}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
    ports:
      - '${FRONTEND_HOST_PORT:-3031}:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
    networks:
      - helali-network

networks:
  helali-network:
    external: true
    name: helali-network
