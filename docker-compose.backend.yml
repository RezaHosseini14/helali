# Helali API (includes ffmpeg for HLS). Joins existing helali-network from infra.
# Usage on server: docker compose -f docker-compose.backend.yml up -d --build

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: helali-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://root:root@helali-postgres:5432/helali_database?schema=public
      REDIS_URL: redis://helali-redis:6379
      BULLMQ_PREFIX: helali-prod
      JWT_SECRET: ${JWT_SECRET:-change-me-jwt-secret-min-32-chars-long}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret-min-32-chars}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-12h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      BACKEND_PORT: 4000
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://5.159.49.36:4000}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      COOKIE_SECURE: 'false'
      MINIO_ENDPOINT: helali-minio
      MINIO_PORT: 9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-5.159.49.36}
      MINIO_PUBLIC_PORT: ${MINIO_PUBLIC_PORT:-9010}
      MINIO_ACCESS_KEY: minio99
      MINIO_SECRET_KEY: minio123
      MINIO_USE_SSL: 'false'
      STORAGE_DRIVER: minio
      API_ENCRYPTION_ENABLED: 'false'
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - helali-network

networks:
  helali-network:
    external: true
    name: helali-network
