name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'packages/shared/**'
      - 'docker-compose.backend.yml'
      - 'docker-compose.infra.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/deploy-*.mjs'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        required: true
        default: backend
        type: choice
        options:
          - backend
          - infra
          - all

concurrency:
  group: helali-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HELALI_SSH_PASSWORD: ${{ secrets.HELALI_SSH_PASSWORD }}
      HELALI_SERVER: ${{ secrets.HELALI_SERVER }}
      HELALI_SSH_USER: ${{ secrets.HELALI_SSH_USER }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve deploy target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=backend" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate secrets and defaults
        run: |
          if [ -z "$HELALI_SSH_PASSWORD" ]; then
            echo "Missing repository secret: HELALI_SSH_PASSWORD"
            exit 1
          fi
          if [ -z "$HELALI_SERVER" ]; then
            echo "HELALI_SERVER=5.159.49.36" >> "$GITHUB_ENV"
          fi
          if [ -z "$HELALI_SSH_USER" ]; then
            echo "HELALI_SSH_USER=root" >> "$GITHUB_ENV"
          fi

      - name: Deploy infra
        if: steps.target.outputs.value == 'infra' || steps.target.outputs.value == 'all'
        run: npm run deploy:infra

      - name: Deploy backend
        if: steps.target.outputs.value == 'backend' || steps.target.outputs.value == 'all'
        run: npm run deploy:backend

      - name: Smoke check
        if: steps.target.outputs.value != 'infra'
        run: |
          SERVER="${HELALI_SERVER:-5.159.49.36}"
          echo "Checking API health on ${SERVER}:4000 ..."
          for i in $(seq 1 20); do
            if curl -sf "http://${SERVER}:4000/api/v1/health" >/dev/null; then
              echo "API OK"
              curl -sf "http://${SERVER}:4000/api/v1/health"
              echo
              exit 0
            fi
            sleep 5
          done
          echo "API smoke check failed"
          exit 1
