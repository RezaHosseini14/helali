name: (setup) Emit helali runner registration token

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  token:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Create registration token (for VPS config.sh)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners/registration-token" \
            | jq -r '.token')
          test -n "$TOKEN" && test "$TOKEN" != null
          echo "::add-mask::${TOKEN}"
          {
            echo "## helali runner registration token (expires ~1h)"
            echo ""
            echo '```'
            echo "$TOKEN"
            echo '```'
            echo ""
            echo "On VPS as **root**:"
            echo '```bash'
            echo "REGISTRATION_TOKEN='${TOKEN}' bash /opt/helali/scripts/register-self-hosted-runner-helali.sh"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::add-mask::${TOKEN}"
