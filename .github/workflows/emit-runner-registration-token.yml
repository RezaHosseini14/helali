name: (setup) Emit helali runner registration token

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  token:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Create registration token (for VPS config.sh)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners/registration-token" \
            | jq -r '.token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::GitHub did not return a registration token (check workflow permissions: administration + actions write)."
            exit 1
          fi
          echo "::add-mask::${TOKEN}"
          {
            echo "## helali runner registration token (expires ~1h)"
            echo ""
            echo '```'
            echo "$TOKEN"
            echo '```'
            echo ""
            echo "Next: **zarva** repo → Actions → **Bootstrap helali self-hosted runner** → paste token → Run."
            echo ""
            echo "Or on VPS as **root**:"
            echo '```bash'
            echo "REGISTRATION_TOKEN='${TOKEN}' bash /opt/helali/scripts/register-self-hosted-runner-helali.sh"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
        id: mint

      - name: Trigger zarva VPS bootstrap (registers helali-vps)
        env:
          GH_TOKEN: ${{ github.token }}
          REG_TOKEN: ${{ steps.mint.outputs.token }}
        run: |
          set -euo pipefail
          HTTP=$(curl -sS -o /tmp/dispatch.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/RezaHosseini14/zarva/dispatches" \
            -d "{\"event_type\":\"helali-runner-bootstrap\",\"client_payload\":{\"registration_token\":\"${REG_TOKEN}\"}}")
          if [ "$HTTP" = "204" ]; then
            echo "Dispatched zarva bootstrap on zarva-vps."
          else
            echo "::warning::Could not dispatch zarva bootstrap (HTTP ${HTTP}). Run zarva workflow manually with the token from the summary above."
            cat /tmp/dispatch.json || true
          fi
