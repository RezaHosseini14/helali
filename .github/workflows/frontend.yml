name: Frontend

on:
  push:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - 'packages/shared/**'
      - 'docker-compose.frontend.yml'
      - 'apps/frontend/Dockerfile'
      - '.github/workflows/frontend.yml'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: helali-frontend-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: helali-frontend
  REMOTE_DIR: /opt/helali-frontend
  FRONTEND_HOST_PORT: '3031'
  SSH_FLAGS: >-
    -o ConnectTimeout=20
    -o ServerAliveInterval=15
    -o ServerAliveCountMax=20
    -o TCPKeepAlive=yes
    -o StrictHostKeyChecking=accept-new

jobs:
  build:
    name: Build & Scan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      image_ref: ${{ steps.meta.outputs.ref }}
      api_url: ${{ steps.public.outputs.api_url }}
      site_url: ${{ steps.public.outputs.site_url }}
      minio_endpoint: ${{ steps.public.outputs.minio_endpoint }}
    steps:
      - uses: actions/checkout@v4

      - name: Image coordinates
        id: meta
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          IMAGE="${{ env.REGISTRY }}/${OWNER}/${{ env.IMAGE_NAME }}"
          TAG="${{ github.sha }}"
          {
            echo "owner=${OWNER}"
            echo "image=${IMAGE}"
            echo "tag=${TAG}"
            echo "ref=${IMAGE}:${TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve public API URL
        id: public
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
        run: |
          HOST="${SSH_HOST:-5.159.49.36}"
          # Public HTTPS site (nginx). Never bake http://IP:4000 into the client bundle.
          SITE_URL="${PUBLIC_SITE_URL:-https://helali.rmhosseini.ir}"
          SITE_URL="${SITE_URL%/}"
          echo "api_url=${SITE_URL}/api/v1" >> "$GITHUB_OUTPUT"
          echo "site_url=${SITE_URL}" >> "$GITHUB_OUTPUT"
          echo "minio_endpoint=${HOST}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (load for scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.ref }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.public.outputs.api_url }}
            NEXT_PUBLIC_SITE_URL=${{ steps.public.outputs.site_url }}
            APP_TITLE=هلالی
            MINIO_ENDPOINT=${{ steps.public.outputs.minio_endpoint }}
            MINIO_PORT=9010
            MINIO_USE_SSL=false
            BACKEND_INTERNAL_ORIGIN=http://helali-backend:4000
          cache-from: type=gha,scope=helali-frontend
          cache-to: type=gha,mode=max,scope=helali-frontend

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.ref }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.meta.outputs.ref }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.public.outputs.api_url }}
            NEXT_PUBLIC_SITE_URL=${{ steps.public.outputs.site_url }}
            APP_TITLE=هلالی
            MINIO_ENDPOINT=${{ steps.public.outputs.minio_endpoint }}
            MINIO_PORT=9010
            MINIO_USE_SSL=false
            BACKEND_INTERNAL_ORIGIN=http://helali-backend:4000
          cache-from: type=gha,scope=helali-frontend
          cache-to: type=gha,mode=max,scope=helali-frontend

  deploy:
    name: Deploy frontend
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER || 'root' }}
    steps:
      - uses: actions/checkout@v4

      - name: Require secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_PRIVATE_KEY" || { echo "::error::Missing SSH_PRIVATE_KEY"; exit 1; }
          test -n "$SSH_HOST" || { echo "::error::Missing SSH_HOST"; exit 1; }

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Sync compose
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          ssh $SSH_FLAGS "$SSH_USER@$SSH_HOST" "mkdir -p $REMOTE_DIR"
          # shellcheck disable=SC2086
          scp $SSH_FLAGS docker-compose.frontend.yml \
            "$SSH_USER@$SSH_HOST:$REMOTE_DIR/docker-compose.frontend.yml"

      - name: Rollout frontend
        env:
          FRONTEND_IMAGE: ${{ needs.build.outputs.image_ref }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
          API_URL: ${{ needs.build.outputs.api_url }}
          SITE_URL: ${{ needs.build.outputs.site_url }}
          MINIO_ENDPOINT: ${{ needs.build.outputs.minio_endpoint }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          ssh $SSH_FLAGS "$SSH_USER@$SSH_HOST" \
            FRONTEND_IMAGE="$FRONTEND_IMAGE" GHCR_USER="$GHCR_USER" GHCR_TOKEN="$GHCR_TOKEN" \
            API_URL="$API_URL" SITE_URL="$SITE_URL" MINIO_ENDPOINT="$MINIO_ENDPOINT" \
            REMOTE_DIR="$REMOTE_DIR" FRONTEND_HOST_PORT="$FRONTEND_HOST_PORT" \
            bash -s <<'EOF'
          set -euo pipefail
          cd "$REMOTE_DIR"
          unset COMPOSE_FILE COMPOSE_PATH || true

          if [ ! -f .env ]; then
            echo "::error::Missing $REMOTE_DIR/.env — copy deploy/frontend.env.example first"
            exit 1
          fi

          if [ -n "${GHCR_TOKEN}" ]; then
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          fi

          if grep -q '^FRONTEND_IMAGE=.\+' .env; then
            prev=$(grep '^FRONTEND_IMAGE=' .env | head -1 | cut -d= -f2-)
            if grep -q '^FRONTEND_IMAGE_PREV=' .env; then
              sed -i "s|^FRONTEND_IMAGE_PREV=.*|FRONTEND_IMAGE_PREV=${prev}|" .env
            else
              echo "FRONTEND_IMAGE_PREV=${prev}" >> .env
            fi
            sed -i "s|^FRONTEND_IMAGE=.*|FRONTEND_IMAGE=${FRONTEND_IMAGE}|" .env
          else
            echo "FRONTEND_IMAGE=${FRONTEND_IMAGE}" >> .env
          fi

          if grep -q '^FRONTEND_HOST_PORT=' .env; then
            sed -i "s|^FRONTEND_HOST_PORT=.*|FRONTEND_HOST_PORT=${FRONTEND_HOST_PORT}|" .env
          else
            echo "FRONTEND_HOST_PORT=${FRONTEND_HOST_PORT}" >> .env
          fi

          if grep -q '^NEXT_PUBLIC_API_URL=' .env; then
            sed -i "s|^NEXT_PUBLIC_API_URL=.*|NEXT_PUBLIC_API_URL=${API_URL}|" .env
          else
            echo "NEXT_PUBLIC_API_URL=${API_URL}" >> .env
          fi
          if grep -q '^NEXT_PUBLIC_SITE_URL=' .env; then
            sed -i "s|^NEXT_PUBLIC_SITE_URL=.*|NEXT_PUBLIC_SITE_URL=${SITE_URL}|" .env
          else
            echo "NEXT_PUBLIC_SITE_URL=${SITE_URL}" >> .env
          fi
          if grep -q '^MINIO_PUBLIC_ENDPOINT=' .env; then
            sed -i "s|^MINIO_PUBLIC_ENDPOINT=.*|MINIO_PUBLIC_ENDPOINT=${MINIO_ENDPOINT}|" .env
          else
            echo "MINIO_PUBLIC_ENDPOINT=${MINIO_ENDPOINT}" >> .env
          fi

          docker compose -f docker-compose.frontend.yml pull frontend

          up_one() {
            local timeout="$1"
            if docker compose -f docker-compose.frontend.yml up -d --force-recreate --wait --wait-timeout "$timeout" frontend; then
              return 0
            fi
            docker rm -f helali-frontend 2>/dev/null || true
            docker compose -f docker-compose.frontend.yml up -d --force-recreate --wait --wait-timeout "$timeout" frontend
          }
          up_one 180

          docker ps --format '{{.Names}}' | grep -qx 'helali-frontend' || {
            echo '::error::helali-frontend not running'
            docker ps -a --filter name=helali
            exit 1
          }
          docker port helali-frontend 3000/tcp | grep -qE "(:|::)${FRONTEND_HOST_PORT}$" || {
            echo "::error::frontend not on host port ${FRONTEND_HOST_PORT}"
            docker port helali-frontend || true
            exit 1
          }

          EXPECTED=$(docker image inspect --format '{{.Id}}' "$FRONTEND_IMAGE")
          RUNNING=$(docker inspect --format '{{.Image}}' helali-frontend)
          [ "$EXPECTED" = "$RUNNING" ] || {
            echo "::error::image mismatch running=$RUNNING expected=$EXPECTED"
            exit 1
          }

          docker image prune -f || true
          EOF

      - name: Probe
        run: |
          set -uo pipefail
          for i in $(seq 1 36); do
            if curl -fsS --connect-timeout 5 "http://${SSH_HOST}:${FRONTEND_HOST_PORT}" >/dev/null; then
              echo "frontend healthy"
              exit 0
            fi
            sleep 3
          done
          echo "::error::frontend health probe failed"
          # shellcheck disable=SC2086
          ssh $SSH_FLAGS "$SSH_USER@$SSH_HOST" "docker logs helali-frontend --tail 80" || true
          exit 1

      - name: Summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Frontend deploy
          - Image: \`${{ needs.build.outputs.image_ref }}\`
          - Host port: \`${{ env.FRONTEND_HOST_PORT }}\` → container \`3000\`
          - Host: \`${{ env.SSH_HOST }}\`
          - Dir: \`${{ env.REMOTE_DIR }}\`
          EOF
