name: helali CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: helali-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  REMOTE_DIR: /opt/helali
  SSH_FLAGS: >-
    -o ConnectTimeout=20
    -o ServerAliveInterval=15
    -o ServerAliveCountMax=20
    -o TCPKeepAlive=yes
    -o StrictHostKeyChecking=accept-new

jobs:
  # ==========================================
  # STAGE 1: Quality Gate (npm workspaces)
  # ==========================================
  validate:
    name: Quality Gate (Lint & Test)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run Lint
        run: npm run lint

      - name: Run Tests
        run: npm run test

  # ==========================================
  # STAGE 2A: Build & Push Backend Image
  # ==========================================
  build-backend:
    name: Docker Backend (Build & GHCR Push)
    needs: [validate]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    outputs:
      image_ref: ${{ steps.meta.outputs.ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image coordinates
        id: meta
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          IMAGE="${{ env.REGISTRY }}/${OWNER}/helali-backend"
          TAG="${{ github.sha }}"
          {
            echo "image=${IMAGE}"
            echo "tag=${TAG}"
            echo "ref=${IMAGE}:${TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Build & Push Backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: |
            ${{ steps.meta.outputs.ref }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=helali-backend
          cache-to: type=gha,mode=max,scope=helali-backend

  # ==========================================
  # STAGE 2B: Build & Push Frontend Image
  # ==========================================
  build-frontend:
    name: Docker Frontend (Build & GHCR Push)
    needs: [validate]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    outputs:
      image_ref: ${{ steps.meta.outputs.ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image coordinates
        id: meta
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          IMAGE="${{ env.REGISTRY }}/${OWNER}/helali-frontend"
          TAG="${{ github.sha }}"
          {
            echo "image=${IMAGE}"
            echo "tag=${TAG}"
            echo "ref=${IMAGE}:${TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Build & Push Frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.ref }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://helali.rmhosseini.ir/api/v1
            NEXT_PUBLIC_SITE_URL=https://helali.rmhosseini.ir
            APP_TITLE=هلالی
            BACKEND_INTERNAL_ORIGIN=http://backend:3000
            MINIO_ENDPOINT=5.159.49.36
            MINIO_PORT=9010
            MINIO_USE_SSL=false
          cache-from: type=gha,scope=helali-frontend
          cache-to: type=gha,mode=max,scope=helali-frontend

  # ==========================================
  # STAGE 3A: Deployment Preflight
  # ==========================================
  preflight:
    name: Deployment Preflight
    needs: [build-backend, build-frontend]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      deploy_enabled: ${{ steps.check.outputs.deploy_enabled }}

    steps:
      - name: Detect deployment credentials
        id: check
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -n "${SSH_PRIVATE_KEY}" ]; then
            echo "deploy_enabled=true" >> "$GITHUB_OUTPUT"
            echo "Deployment credentials detected."
          else
            echo "deploy_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SSH_PRIVATE_KEY is not configured. Skipping production deployment."
          fi

  # ==========================================
  # STAGE 3B: Production Deployment to Server
  # ==========================================
  deploy:
    name: Deploy to Production VPS
    needs: [build-backend, build-frontend, preflight]
    if: github.event_name != 'pull_request' && needs.preflight.outputs.deploy_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST || '5.159.49.36' }}
      SSH_USER: ${{ secrets.SSH_USER || 'root' }}
      TLS_HOST: ${{ secrets.SSH_HOST || '5.159.49.36' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_HOST" || { echo "::error::Missing SSH_HOST"; exit 1; }
          test -n "$SSH_USER" || { echo "::error::Missing SSH_USER"; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "::error::Missing secret SSH_PRIVATE_KEY"; exit 1; }

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat <<'EOF' > ~/.ssh/config
          Host *
            ServerAliveInterval 15
            ServerAliveCountMax 20
            TCPKeepAlive yes
            ConnectTimeout 30
            StrictHostKeyChecking accept-new
          EOF
          ssh-keyscan -H -T 20 "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || {
            echo "WARN: ssh-keyscan failed; host key will be verified via accept-new"
          }
          chmod 600 ~/.ssh/known_hosts ~/.ssh/config 2>/dev/null || true

      - name: Sync compose + nginx config to server
        run: |
          set -euo pipefail

          retry() {
            local attempt=1
            local max=5
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::Command failed after ${max} attempts: $*"
                return 1
              fi
              echo "Attempt ${attempt} failed. Retrying in $((attempt * 5))s..."
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }

          # shellcheck disable=SC2086
          retry ssh $SSH_FLAGS "$SSH_USER@$SSH_HOST" "mkdir -p $REMOTE_DIR/docker $REMOTE_DIR/data && chown -R 1001:1001 $REMOTE_DIR/data 2>/dev/null || true"
          # shellcheck disable=SC2086
          retry scp $SSH_FLAGS docker-compose.prod.yml "$SSH_USER@$SSH_HOST:$REMOTE_DIR/docker-compose.yml"
          # shellcheck disable=SC2086
          retry scp $SSH_FLAGS docker/nginx.conf "$SSH_USER@$SSH_HOST:$REMOTE_DIR/docker/nginx.conf"
          # shellcheck disable=SC2086
          retry ssh $SSH_FLAGS "$SSH_USER@$SSH_HOST" "test -f $REMOTE_DIR/config.json || printf '{}\n' > $REMOTE_DIR/config.json"

      - name: Pull images & rolling restart on server
        env:
          BACKEND_IMAGE: ${{ needs.build-backend.outputs.image_ref }}
          FRONTEND_IMAGE: ${{ needs.build-frontend.outputs.image_ref }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail

          run_remote_deploy() {
            # shellcheck disable=SC2086
            ssh $SSH_FLAGS \
              "$SSH_USER@$SSH_HOST" \
              BACKEND_IMAGE="$BACKEND_IMAGE" FRONTEND_IMAGE="$FRONTEND_IMAGE" \
              GHCR_USER="$GHCR_USER" GHCR_TOKEN="$GHCR_TOKEN" REMOTE_DIR="$REMOTE_DIR" \
              TLS_HOST="$TLS_HOST" \
              bash -s <<'EOF'
          set -euo pipefail
          cd "$REMOTE_DIR"
          unset COMPOSE_FILE COMPOSE_PATH || true
          export COMPOSE_PROJECT_NAME=helali

          echo "--> Deploy host: $(hostname) pwd=$(pwd)"
          echo "--> Compose ports (must include 3030/3031/3032):"
          grep -nE 'ports:|3030|3031|3032' docker-compose.yml || true

          if [ -n "${GHCR_TOKEN}" ]; then
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          fi

          touch .env
          if grep -q '^BACKEND_IMAGE=' .env; then
            sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${BACKEND_IMAGE}|" .env
          else
            echo "BACKEND_IMAGE=${BACKEND_IMAGE}" >> .env
          fi

          if grep -q '^FRONTEND_IMAGE=' .env; then
            sed -i "s|^FRONTEND_IMAGE=.*|FRONTEND_IMAGE=${FRONTEND_IMAGE}|" .env
          else
            echo "FRONTEND_IMAGE=${FRONTEND_IMAGE}" >> .env
          fi

          for kv in BACKEND_PORT=3030 FRONTEND_PORT=3031 NGINX_PORT=3032; do
            key=${kv%%=*}; val=${kv#*=}
            if grep -q "^${key}=" .env; then
              sed -i "s|^${key}=.*|${key}=${val}|" .env
            else
              echo "${key}=${val}" >> .env
            fi
          done

          if [ -z "${BACKEND_IMAGE}" ] || [ -z "${FRONTEND_IMAGE}" ]; then
            echo "::error::Build jobs did not pass backend/frontend image refs"
            exit 1
          fi
          echo "--> Target images: backend=${BACKEND_IMAGE} frontend=${FRONTEND_IMAGE}"
          grep -E '^(BACKEND_IMAGE|FRONTEND_IMAGE)=' .env

          # Non-empty secrets (empty REDIS_PASSWORD breaks healthcheck)
          ensure_nonempty_secret() {
            local key="$1"
            if ! grep -qE "^${key}=.+" .env; then
              sed -i "/^${key}=/d" .env || true
              echo "${key}=$(openssl rand -hex 24)" >> .env
              echo "--> Wrote non-empty ${key} to .env"
            fi
          }
          ensure_nonempty_secret POSTGRES_PASSWORD
          ensure_nonempty_secret REDIS_PASSWORD
          if ! grep -q '^JWT_SECRET=.\+' .env; then
            sed -i '/^JWT_SECRET=/d' .env || true
            echo "JWT_SECRET=$(openssl rand -base64 48)" >> .env
          fi
          if ! grep -q '^JWT_REFRESH_SECRET=.\+' .env; then
            sed -i '/^JWT_REFRESH_SECRET=/d' .env || true
            echo "JWT_REFRESH_SECRET=$(openssl rand -base64 48)" >> .env
          fi

          sed -i '/^API_IMAGE=/d;/^WEB_IMAGE=/d' .env || true
          docker rm -f helali-api helali-web 2>/dev/null || true

          # Free container names held by a foreign compose project (old split stack).
          # Never delete live helali project containers before recreate succeeds.
          remove_foreign() {
            local name="$1"
            if ! docker inspect "$name" >/dev/null 2>&1; then
              return 0
            fi
            local project
            project=$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' "$name" 2>/dev/null || true)
            if [ "$project" = "helali" ]; then
              return 0
            fi
            echo "--> remove foreign ${name} (project='${project:-none}'); volumes kept"
            docker rm -f "$name" >/dev/null
          }
          for c in helali-postgres helali-redis helali-minio; do
            remove_foreign "$c"
          done

          mkdir -p docker/certs
          if [ ! -s docker/certs/server.crt ] || [ ! -s docker/certs/server.key ]; then
            echo "--> Creating self-signed TLS certificate..."
            openssl req -x509 -nodes -days 825 -newkey rsa:2048 \
              -keyout docker/certs/server.key \
              -out docker/certs/server.crt \
              -subj "/CN=${TLS_HOST:-5.159.49.36}" \
              -addext "subjectAltName=IP:${TLS_HOST:-5.159.49.36}"
          fi

          echo "--> Pulling latest container images..."
          pulled=0
          for attempt in 1 2 3 4 5; do
            if docker compose -f docker-compose.yml pull backend frontend; then
              pulled=1
              break
            fi
            echo "compose pull failed (attempt ${attempt}), retrying..."
            sleep $((attempt * 4))
          done
          if [ "$pulled" != 1 ]; then
            echo "::error::docker compose pull failed after 5 attempts"
            df -h / || true
            exit 1
          fi

          echo "--> Starting Postgres and Redis..."
          if ! docker compose -f docker-compose.yml up -d postgres redis --wait --wait-timeout 90; then
            echo "::error::Postgres or Redis failed to become healthy"
            docker compose -f docker-compose.yml ps || true
            docker logs helali-postgres --tail 50 || true
            docker logs helali-redis --tail 50 || true
            exit 1
          fi

          echo "--> Starting MinIO (no --wait; scratch image has no health binary)..."
          if ! docker compose -f docker-compose.yml up -d minio; then
            echo "::error::MinIO failed to start"
            docker logs helali-minio --tail 40 || true
            exit 1
          fi

          echo "--> Executing database migrations..."
          if ! docker compose -f docker-compose.yml run --rm --no-deps backend \
            npx prisma migrate deploy --schema=apps/backend/prisma/schema.prisma; then
            echo "::error::Database migrations failed! Halting deployment to protect uptime."
            exit 1
          fi

          up_one() {
            local service="$1"
            local timeout="$2"
            echo "--> Starting ${service}..."
            remove_foreign "helali-${service}"
            if docker compose -f docker-compose.yml up -d --force-recreate --wait --wait-timeout "$timeout" "$service"; then
              return 0
            fi
            echo "--> ${service} failed; removing stale container_name and retrying once..."
            docker rm -f "helali-${service}" 2>/dev/null || true
            docker compose -f docker-compose.yml up -d --force-recreate --wait --wait-timeout "$timeout" "$service"
          }

          echo "--> Recreating app tier one service at a time..."
          if ! up_one backend 180; then
            echo "::error::backend failed to become healthy"
            docker logs helali-backend --tail 120 || true
            exit 1
          fi
          if ! up_one frontend 180; then
            echo "::error::frontend failed to become healthy"
            docker logs helali-frontend --tail 120 || true
            exit 1
          fi
          if ! up_one nginx 120; then
            echo "::error::nginx failed to become healthy"
            docker logs helali-nginx --tail 120 || true
            exit 1
          fi

          echo "--> Asserting app containers exist and are running..."
          for c in helali-backend helali-frontend helali-nginx; do
            if ! docker ps --format '{{.Names}}' | grep -qx "$c"; then
              echo "::error::Expected running container missing: $c"
              docker ps -a --filter name=helali || true
              exit 1
            fi
          done

          echo "--> Verifying running containers use the freshly built images..."
          EXPECTED_BACKEND_ID=$(docker image inspect --format '{{.Id}}' "$BACKEND_IMAGE" 2>/dev/null || echo '')
          EXPECTED_FRONTEND_ID=$(docker image inspect --format '{{.Id}}' "$FRONTEND_IMAGE" 2>/dev/null || echo '')
          RUNNING_BACKEND_ID=$(docker inspect --format '{{.Image}}' helali-backend 2>/dev/null || echo '')
          RUNNING_FRONTEND_ID=$(docker inspect --format '{{.Image}}' helali-frontend 2>/dev/null || echo '')
          echo "    backend:  running=${RUNNING_BACKEND_ID} expected=${EXPECTED_BACKEND_ID}"
          echo "    frontend: running=${RUNNING_FRONTEND_ID} expected=${EXPECTED_FRONTEND_ID}"
          if [ -z "$RUNNING_BACKEND_ID" ] || [ "$RUNNING_BACKEND_ID" != "$EXPECTED_BACKEND_ID" ] \
            || [ -z "$RUNNING_FRONTEND_ID" ] || [ "$RUNNING_FRONTEND_ID" != "$EXPECTED_FRONTEND_ID" ]; then
            echo "::error::Running containers are not on the built images"
            docker ps --filter name=helali || true
            exit 1
          fi

          echo "--> Verifying published host ports (3030/3031/3032)..."
          docker ps --filter name=helali --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
          BACKEND_PORTS=$(docker port helali-backend 3000/tcp 2>/dev/null || true)
          FRONTEND_PORTS=$(docker port helali-frontend 3000/tcp 2>/dev/null || true)
          NGINX_PORTS=$(docker port helali-nginx 443/tcp 2>/dev/null || true)
          echo "    backend 3000/tcp -> ${BACKEND_PORTS}"
          echo "    frontend 3000/tcp -> ${FRONTEND_PORTS}"
          echo "    nginx 443/tcp -> ${NGINX_PORTS}"
          echo "$BACKEND_PORTS" | grep -qE '(:|::)3030$' || {
            echo "::error::backend is not published on host port 3030 (got: ${BACKEND_PORTS})"
            exit 1
          }
          echo "$FRONTEND_PORTS" | grep -qE '(:|::)3031$' || {
            echo "::error::frontend is not published on host port 3031 (got: ${FRONTEND_PORTS})"
            exit 1
          }
          echo "$NGINX_PORTS" | grep -qE '(:|::)3032$' || {
            echo "::error::nginx is not published on host port 3032 (got: ${NGINX_PORTS})"
            exit 1
          }

          echo "--> Local health probe via nginx..."
          if ! docker exec helali-nginx wget -qO- http://127.0.0.1/api/v1/health; then
            echo "::error::nginx local /api/v1/health failed after recreate"
            docker logs helali-backend --tail 80 || true
            docker logs helali-frontend --tail 80 || true
            docker logs helali-nginx --tail 80 || true
            exit 1
          fi
          echo ""

          echo "--> Reloading nginx..."
          reloaded=0
          for attempt in $(seq 1 20); do
            if docker exec helali-nginx nginx -s reload; then
              reloaded=1
              break
            fi
            sleep 2
          done
          if [ "$reloaded" != 1 ]; then
            echo "::error::nginx did not accept reload"
            docker logs helali-nginx --tail 80 || true
            exit 1
          fi

          echo "--> Cleaning up dangling images..."
          docker image prune -f || true
          EOF
          }

          attempt=1
          max=3
          until run_remote_deploy; do
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::Remote rollout failed after ${max} attempts"
              # shellcheck disable=SC2086
              ssh $SSH_FLAGS "$SSH_USER@$SSH_HOST" \
                'cd /opt/helali 2>/dev/null || exit 0; echo "=== df -h / ==="; df -h /; echo "=== docker ps -a (helali) ==="; docker ps -a --filter name=helali --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"' \
                || true
              exit 1
            fi
            echo "Remote rollout attempt ${attempt} failed. Retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
            attempt=$((attempt + 1))
          done

      - name: Production Health Check Verification
        run: |
          set -uo pipefail

          echo "--> Confirming app containers exist on the VPS..."
          # shellcheck disable=SC2086
          ssh $SSH_FLAGS "$SSH_USER@$SSH_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          missing=0
          for c in helali-backend helali-frontend helali-nginx; do
            if docker ps --format '{{.Names}}' | grep -qx "$c"; then
              echo "OK running: $c"
            else
              echo "::error::Missing running container: $c"
              missing=1
            fi
          done
          echo "=== docker ps (helali) ==="
          docker ps -a --filter name=helali --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}\t{{.Image}}'
          if [ "$missing" -ne 0 ]; then
            echo "::error::App containers are not running"
            exit 1
          fi
          REMOTE

          echo "Verifying stack at https://${SSH_HOST}:3032 ..."
          STACK_UP=false
          for i in $(seq 1 40); do
            if curl -kfsS --connect-timeout 5 "https://${SSH_HOST}:3032/api/v1/health" >/dev/null \
              && curl -kfsS --connect-timeout 5 "https://${SSH_HOST}:3032" >/dev/null; then
              STACK_UP=true
              echo "Frontend + Backend (via nginx) healthy on attempt $i"
              curl -kfsS "https://${SSH_HOST}:3032/api/v1/health"
              echo ""
              break
            fi
            echo "Waiting for :3032... ($i/40)"
            sleep 3
          done

          if [ "$STACK_UP" = false ]; then
            echo "::error::Deployment health check failed (port 3032 unreachable from GitHub runner)"
            # shellcheck disable=SC2086
            ssh $SSH_FLAGS "$SSH_USER@$SSH_HOST" "docker ps -a --filter name=helali" || true
            # shellcheck disable=SC2086
            ssh $SSH_FLAGS "$SSH_USER@$SSH_HOST" "docker logs helali-frontend --tail 60" || true
            # shellcheck disable=SC2086
            ssh $SSH_FLAGS "$SSH_USER@$SSH_HOST" "docker logs helali-backend --tail 60" || true
            # shellcheck disable=SC2086
            ssh $SSH_FLAGS "$SSH_USER@$SSH_HOST" "docker logs helali-nginx --tail 60" || true
            exit 1
          fi

          LOGIN_CODE=$(curl -k -s -o /dev/null -w "%{http_code}" --connect-timeout 5 "https://${SSH_HOST}:3032/login" || echo "000")
          AUTH_CODE=$(curl -k -s -o /dev/null -w "%{http_code}" --connect-timeout 5 "https://${SSH_HOST}:3032/api/v1/auth/me" || echo "000")
          echo "Post-deploy probe: /login=${LOGIN_CODE} /api/v1/auth/me=${AUTH_CODE}"
          if [ "$LOGIN_CODE" != "200" ]; then
            echo "::error::/login returned ${LOGIN_CODE} (expected 200)"
            exit 1
          fi
          if [ "$AUTH_CODE" = "404" ]; then
            echo "::error::/api/v1/auth/me returned 404 — backend may be stale"
            exit 1
          fi

          echo "All services deployed and verified successfully!"

      - name: Publish Deployment Summary
        if: always()
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## helali Production Deployment Report

          | Component | Status | URL |
          |---|---|---|
          | **Gateway** | Live | [https://${{ env.SSH_HOST }}:3032](https://${{ env.SSH_HOST }}:3032) |
          | **Health Check** | Healthy | [https://${{ env.SSH_HOST }}:3032/api/v1/health](https://${{ env.SSH_HOST }}:3032/api/v1/health) |

          - **Git SHA**: \`${{ github.sha }}\`
          - **Triggered By**: @${{ github.actor }}
          - **Target VPS**: \`${{ env.SSH_HOST }}\` (\`/opt/helali\`)
          - **Gateway**: nginx on \`:3032\` → backend \`/api\`, frontend \`/\`
          - **Direct ports**: backend \`:3030\`, frontend \`:3031\`
          - **Backend Image**: \`${{ needs.build-backend.outputs.image_ref }}\`
          - **Frontend Image**: \`${{ needs.build-frontend.outputs.image_ref }}\`
          EOF
