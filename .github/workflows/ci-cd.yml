name: helali CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: helali-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  REMOTE_DIR: /opt/helali
  SSH_FLAGS: >-
    -o ConnectTimeout=20
    -o ServerAliveInterval=15
    -o ServerAliveCountMax=20
    -o TCPKeepAlive=yes
    -o StrictHostKeyChecking=accept-new

jobs:
  # ==========================================
  # STAGE 1: Quality Gate (npm workspaces)
  # ==========================================
  validate:
    name: Quality Gate (Lint & Test)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run Lint
        run: npm run lint

      - name: Run Tests
        run: npm run test

  # ==========================================
  # STAGE 2A: Build & Push Backend Image
  # ==========================================
  build-backend:
    name: Docker Backend (Build & GHCR Push)
    needs: [validate]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    outputs:
      image_ref: ${{ steps.meta.outputs.ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image coordinates
        id: meta
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          IMAGE="${{ env.REGISTRY }}/${OWNER}/helali-backend"
          TAG="${{ github.sha }}"
          {
            echo "image=${IMAGE}"
            echo "tag=${TAG}"
            echo "ref=${IMAGE}:${TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Build & Push Backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: |
            ${{ steps.meta.outputs.ref }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=helali-backend
          cache-to: type=gha,mode=max,scope=helali-backend

  # ==========================================
  # STAGE 2B: Build & Push Frontend Image
  # ==========================================
  build-frontend:
    name: Docker Frontend (Build & GHCR Push)
    needs: [validate]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    outputs:
      image_ref: ${{ steps.meta.outputs.ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image coordinates
        id: meta
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          IMAGE="${{ env.REGISTRY }}/${OWNER}/helali-frontend"
          TAG="${{ github.sha }}"
          {
            echo "image=${IMAGE}"
            echo "tag=${TAG}"
            echo "ref=${IMAGE}:${TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Build & Push Frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.ref }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://helali.rmhosseini.ir/api/v1
            NEXT_PUBLIC_SITE_URL=https://helali.rmhosseini.ir
            APP_TITLE=هلالی
            BACKEND_INTERNAL_ORIGIN=http://backend:3000
            MINIO_ENDPOINT=109.70.78.80
            MINIO_PORT=9010
            MINIO_USE_SSL=false
          cache-from: type=gha,scope=helali-frontend
          cache-to: type=gha,mode=max,scope=helali-frontend

  # ==========================================
  # STAGE 3A: Deployment Preflight
  # ==========================================
  preflight:
    name: Deployment Preflight
    needs: [build-backend, build-frontend]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      deploy_enabled: ${{ steps.check.outputs.deploy_enabled }}

    steps:
      - name: Detect deployment credentials
        id: check
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_RUNS_ON: ${{ vars.DEPLOY_RUNS_ON }}
        run: |
          if [ -n "${SSH_PRIVATE_KEY}" ] || echo "${DEPLOY_RUNS_ON:-}" | grep -q 'self-hosted'; then
            echo "deploy_enabled=true" >> "$GITHUB_OUTPUT"
            echo "Deployment credentials / self-hosted runner config detected."
          else
            echo "deploy_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SSH_PRIVATE_KEY is not configured (and DEPLOY_RUNS_ON is not self-hosted). Skipping production deployment."
          fi

  # ==========================================
  # STAGE 3B: Production Deployment to Server
  # ==========================================
  deploy:
    name: Deploy to Production VPS
    needs: [build-backend, build-frontend, preflight]
    if: github.event_name != 'pull_request' && needs.preflight.outputs.deploy_enabled == 'true'
    # Default: GitHub-hosted (SSH). For firewalled VPS set repo variable (same as zarva / saf-shekan):
    #   DEPLOY_RUNS_ON = ["self-hosted","helali"]
    runs-on: ${{ fromJSON(vars.DEPLOY_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 35
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST || '109.70.78.80' }}
      SSH_USER: ${{ secrets.SSH_USER || 'root' }}
      TLS_HOST: ${{ secrets.TLS_HOST || 'helali.rmhosseini.ir' }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve deploy mode
        id: mode
        run: |
          if [ "${{ runner.environment }}" = "self-hosted" ]; then
            echo "mode=local" >> "$GITHUB_OUTPUT"
            echo "--> Deploy mode: LOCAL (self-hosted runner on the VPS)"
          else
            echo "mode=ssh" >> "$GITHUB_OUTPUT"
            echo "--> Deploy mode: SSH from GitHub-hosted runner → ${SSH_USER}@${SSH_HOST}:${SSH_PORT}"
          fi

      - name: Validate required secrets (SSH mode)
        if: steps.mode.outputs.mode == 'ssh'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_HOST" || { echo "::error::Missing SSH_HOST"; exit 1; }
          test -n "$SSH_USER" || { echo "::error::Missing SSH_USER"; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "::error::Missing secret SSH_PRIVATE_KEY"; exit 1; }
          P="${SSH_PORT:-22}"
          case "$P" in
            ''|*[!0-9]*)
              echo "::error::SSH_PORT must be a positive integer (1-65535), got: ${P}"
              exit 1
              ;;
          esac
          if [ "$P" -lt 1 ] || [ "$P" -gt 65535 ]; then
            echo "::error::SSH_PORT out of range: ${P}"
            exit 1
          fi
          echo "SSH_FLAGS=-o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o StrictHostKeyChecking=accept-new -p ${P}" >> "$GITHUB_ENV"
          echo "--> SSH target: ${SSH_USER}@${SSH_HOST} port ${P}; TLS_HOST=${TLS_HOST}"

      - name: Preflight TCP reachability (SSH mode)
        if: steps.mode.outputs.mode == 'ssh'
        run: |
          set -euo pipefail
          P="${SSH_PORT:-22}"
          echo "--> Probing ${SSH_HOST}:${P} from this GitHub runner..."
          if command -v nc >/dev/null 2>&1; then
            ok=0
            for i in 1 2 3; do
              if nc -z -w 8 "$SSH_HOST" "$P"; then
                ok=1
                break
              fi
              sleep 2
            done
            if [ "$ok" != 1 ]; then
              echo "::error::TCP ${SSH_HOST}:${P} is unreachable from GitHub Actions (timeout)."
              echo "::error::Fix A (recommended): register self-hosted runner ON the VPS with labels self-hosted,helali and set DEPLOY_RUNS_ON to [\"self-hosted\",\"helali\"] (same pattern as zarva / saf-shekan)."
              echo "::error::Fix B: open inbound TCP ${P} and set SSH_HOST to the live VPS IP (default 109.70.78.80 if secret is unset)."
              exit 1
            fi
          else
            echo "WARN: nc not available; skipping TCP preflight"
          fi
          echo "--> TCP ${SSH_HOST}:${P} is reachable from this runner"

      - name: Setup SSH agent
        if: steps.mode.outputs.mode == 'ssh'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        if: steps.mode.outputs.mode == 'ssh'
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H -T 20 -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 600 ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync compose + scripts (SSH)
        if: steps.mode.outputs.mode == 'ssh'
        run: |
          set -euo pipefail
          retry() {
            local attempt=1
            local max=3
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::Command failed after ${max} attempts: $*"
                return 1
              fi
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }
          # shellcheck disable=SC2086
          retry ssh $SSH_FLAGS "$SSH_USER@$SSH_HOST" "mkdir -p $REMOTE_DIR/docker $REMOTE_DIR/data $REMOTE_DIR/docker/certs && chown -R github-runner:github-runner $REMOTE_DIR 2>/dev/null || chown -R 1001:1001 $REMOTE_DIR/data 2>/dev/null || true"
          # shellcheck disable=SC2086
          retry scp $SSH_FLAGS docker-compose.prod.yml "$SSH_USER@$SSH_HOST:$REMOTE_DIR/docker-compose.yml"
          # shellcheck disable=SC2086
          retry scp $SSH_FLAGS docker/nginx.conf "$SSH_USER@$SSH_HOST:$REMOTE_DIR/docker/nginx.conf"
          # shellcheck disable=SC2086
          retry scp $SSH_FLAGS scripts/ci-deploy-on-host.sh "$SSH_USER@$SSH_HOST:$REMOTE_DIR/ci-deploy-on-host.sh"
          # shellcheck disable=SC2086
          retry ssh $SSH_FLAGS "$SSH_USER@$SSH_HOST" "chmod +x $REMOTE_DIR/ci-deploy-on-host.sh; test -f $REMOTE_DIR/config.json || printf '{}\n' > $REMOTE_DIR/config.json"

      - name: Sync compose + scripts (local / self-hosted)
        if: steps.mode.outputs.mode == 'local'
        run: |
          set -euo pipefail
          install_tree() {
            mkdir -p "$REMOTE_DIR/docker" "$REMOTE_DIR/data" "$REMOTE_DIR/docker/certs"
            cp docker-compose.prod.yml "$REMOTE_DIR/docker-compose.yml"
            cp docker/nginx.conf "$REMOTE_DIR/docker/nginx.conf"
            cp scripts/ci-deploy-on-host.sh "$REMOTE_DIR/ci-deploy-on-host.sh"
            chmod +x "$REMOTE_DIR/ci-deploy-on-host.sh"
            test -f "$REMOTE_DIR/config.json" || printf '{}\n' > "$REMOTE_DIR/config.json"
            chown -R 1001:1001 "$REMOTE_DIR/data" 2>/dev/null || true
          }
          if ! install_tree 2>/dev/null; then
            echo "--> Falling back to sudo for $REMOTE_DIR..."
            sudo mkdir -p "$REMOTE_DIR/docker" "$REMOTE_DIR/data" "$REMOTE_DIR/docker/certs"
            sudo cp docker-compose.prod.yml "$REMOTE_DIR/docker-compose.yml"
            sudo cp docker/nginx.conf "$REMOTE_DIR/docker/nginx.conf"
            sudo cp scripts/ci-deploy-on-host.sh "$REMOTE_DIR/ci-deploy-on-host.sh"
            sudo chmod +x "$REMOTE_DIR/ci-deploy-on-host.sh"
            sudo bash -c "test -f $REMOTE_DIR/config.json || printf '{}\n' > $REMOTE_DIR/config.json"
            sudo chown -R github-runner:github-runner "$REMOTE_DIR"
            sudo chown -R 1001:1001 "$REMOTE_DIR/data" 2>/dev/null || true
          fi

      - name: Pull images & rolling restart on server
        env:
          BACKEND_IMAGE: ${{ needs.build-backend.outputs.image_ref }}
          FRONTEND_IMAGE: ${{ needs.build-frontend.outputs.image_ref }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
          DEPLOY_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_MODE" = "local" ]; then
            BACKEND_IMAGE="$BACKEND_IMAGE" FRONTEND_IMAGE="$FRONTEND_IMAGE" \
              GHCR_USER="$GHCR_USER" GHCR_TOKEN="$GHCR_TOKEN" \
              REMOTE_DIR="$REMOTE_DIR" TLS_HOST="$TLS_HOST" \
              bash "$REMOTE_DIR/ci-deploy-on-host.sh"
          else
            run_remote_deploy() {
              # shellcheck disable=SC2086
              ssh $SSH_FLAGS \
                "$SSH_USER@$SSH_HOST" \
                BACKEND_IMAGE="$BACKEND_IMAGE" FRONTEND_IMAGE="$FRONTEND_IMAGE" \
                GHCR_USER="$GHCR_USER" GHCR_TOKEN="$GHCR_TOKEN" REMOTE_DIR="$REMOTE_DIR" \
                TLS_HOST="$TLS_HOST" \
                bash "$REMOTE_DIR/ci-deploy-on-host.sh"
            }
            attempt=1
            max=3
            until run_remote_deploy; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::Remote rollout failed after ${max} attempts"
                exit 1
              fi
              sleep $((attempt * 10))
              attempt=$((attempt + 1))
            done
          fi

      - name: Production Health Check Verification
        env:
          DEPLOY_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -uo pipefail

          check_containers() {
            set -euo pipefail
            missing=0
            for c in helali-backend helali-frontend helali-nginx; do
              if docker ps --format '{{.Names}}' | grep -qx "$c"; then
                echo "OK running: $c"
              else
                echo "::error::Missing running container: $c"
                missing=1
              fi
            done
            docker ps -a --filter name=helali --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}\t{{.Image}}'
            if [ "$missing" -ne 0 ]; then
              exit 1
            fi
          }

          echo "--> Confirming app containers..."
          if [ "$DEPLOY_MODE" = "local" ]; then
            check_containers
          else
            # shellcheck disable=SC2086
            ssh $SSH_FLAGS "$SSH_USER@$SSH_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          missing=0
          for c in helali-backend helali-frontend helali-nginx; do
            if docker ps --format '{{.Names}}' | grep -qx "$c"; then
              echo "OK running: $c"
            else
              echo "::error::Missing running container: $c"
              missing=1
            fi
          done
          docker ps -a --filter name=helali --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}\t{{.Image}}'
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          REMOTE
          fi

          HEALTH_URLS=(
            "https://${TLS_HOST}/api/v1/health"
            "https://127.0.0.1/api/v1/health"
            "https://127.0.0.1:3032/api/v1/health"
          )
          HOME_URLS=(
            "https://${TLS_HOST}/"
            "https://127.0.0.1/"
            "https://127.0.0.1:3032/"
          )
          echo "Verifying stack (domain ${TLS_HOST}, host nginx, or docker gateway :3032)..."
          STACK_UP=false
          for i in $(seq 1 40); do
            for idx in 0 1 2; do
              h="${HEALTH_URLS[$idx]}"
              p="${HOME_URLS[$idx]}"
              if curl -kfsS --connect-timeout 5 "$h" >/dev/null \
                && curl -kfsS --connect-timeout 5 "$p" >/dev/null; then
                STACK_UP=true
                echo "Healthy via $h (attempt $i)"
                curl -kfsS "$h"
                echo ""
                break 2
              fi
            done
            echo "Waiting for health... ($i/40)"
            sleep 3
          done

          if [ "$STACK_UP" = false ]; then
            echo "::error::Deployment health check failed for ${TLS_HOST}"
            if [ "$DEPLOY_MODE" = "local" ]; then
              docker ps -a --filter name=helali || true
              docker logs helali-backend --tail 60 || true
              docker logs helali-frontend --tail 60 || true
            else
              # shellcheck disable=SC2086
              ssh $SSH_FLAGS "$SSH_USER@$SSH_HOST" "docker ps -a --filter name=helali" || true
            fi
            exit 1
          fi

          LOGIN_CODE=$(curl -k -s -o /dev/null -w "%{http_code}" --connect-timeout 5 "https://${TLS_HOST}/login" \
            || curl -k -s -o /dev/null -w "%{http_code}" --connect-timeout 5 "https://127.0.0.1:3032/login" \
            || echo "000")
          echo "Post-deploy probe: /login=${LOGIN_CODE}"
          if [ "$LOGIN_CODE" != "200" ] && [ "$LOGIN_CODE" != "307" ] && [ "$LOGIN_CODE" != "308" ]; then
            echo "::warning::/login returned ${LOGIN_CODE} (expected 200/307)"
          fi

          echo "All services deployed and verified successfully!"

      - name: Publish Deployment Summary
        if: always()
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## helali Production Deployment Report

          | Component | Status | URL |
          |---|---|---|
          | **Public site** | Live | [https://${{ env.TLS_HOST }}](https://${{ env.TLS_HOST }}) |
          | **Health** | Healthy | [https://${{ env.TLS_HOST }}/api/v1/health](https://${{ env.TLS_HOST }}/api/v1/health) |
          | **Docker gateway** | Ops | \`https://127.0.0.1:3032\` |

          - **Git SHA**: \`${{ github.sha }}\`
          - **Triggered By**: @${{ github.actor }}
          - **Target VPS**: \`${{ env.SSH_HOST }}\` (\`/opt/helali\`)
          - **Host nginx**: \`https://${{ env.TLS_HOST }}\` → backend \`:3030\`, frontend \`:3031\`
          - **Backend Image**: \`${{ needs.build-backend.outputs.image_ref }}\`
          - **Frontend Image**: \`${{ needs.build-frontend.outputs.image_ref }}\`
          EOF
