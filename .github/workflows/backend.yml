name: Backend

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'packages/shared/**'
      - 'docker-compose.backend.yml'
      - 'apps/backend/Dockerfile'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

concurrency:
  group: helali-backend-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: helali-backend
  REMOTE_DIR: /opt/helali-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Image coordinates
        id: meta
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          SHA='${{ github.sha }}'
          IMAGE="ghcr.io/${OWNER}/${{ env.IMAGE_NAME }}"
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${SHA}" >> "$GITHUB_OUTPUT"
          echo "ref=${IMAGE}:${SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.ref }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          test -n "$SSH_PRIVATE_KEY" || { echo "Missing secret SSH_PRIVATE_KEY"; exit 1; }
          test -n "$SSH_HOST" || { echo "Missing secret SSH_HOST"; exit 1; }
          test -n "$SSH_USER" || { echo "Missing secret SSH_USER"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload compose file
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" "mkdir -p ${{ env.REMOTE_DIR }}"
          scp -i ~/.ssh/id_ed25519 docker-compose.backend.yml \
            "$SSH_USER@$SSH_HOST:${{ env.REMOTE_DIR }}/docker-compose.backend.yml"

      - name: Pull and restart on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          IMAGE_REF: ${{ steps.meta.outputs.ref }}
          GHCR_USER: ${{ steps.meta.outputs.owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          test -n "$GHCR_TOKEN" || { echo "Missing secret GHCR_PULL_TOKEN (PAT with read:packages)"; exit 1; }
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" \
            env IMAGE_REF="$IMAGE_REF" GHCR_USER="$GHCR_USER" GHCR_TOKEN="$GHCR_TOKEN" REMOTE_DIR="${{ env.REMOTE_DIR }}" \
            bash -s <<'EOF'
          set -euo pipefail
          cd "$REMOTE_DIR"
          if [ ! -f .env ]; then
            echo "Missing $REMOTE_DIR/.env on server. Copy deploy/backend.env.example first."
            exit 1
          fi
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          if grep -q '^BACKEND_IMAGE=' .env; then
            sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${IMAGE_REF}|" .env
          else
            echo "BACKEND_IMAGE=${IMAGE_REF}" >> .env
          fi
          docker compose -f docker-compose.backend.yml pull
          docker compose -f docker-compose.backend.yml up -d --remove-orphans
          docker image prune -f || true
          EOF

      - name: Health check
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          for i in $(seq 1 30); do
            if curl -sf "http://${SSH_HOST}:4000/api/v1/health" >/dev/null; then
              curl -sf "http://${SSH_HOST}:4000/api/v1/health"
              echo
              exit 0
            fi
            sleep 5
          done
          echo "Backend health check failed"
          exit 1
