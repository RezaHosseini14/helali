# Helali infrastructure only (safe to run alongside other apps).
# Usage: docker compose -f docker-compose.infra.yml up -d

services:
  postgres:
    image: docker.arvancloud.ir/library/postgres:16-alpine
    container_name: helali-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: helali_database
    ports:
      - '5433:5432'
    volumes:
      - helali_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U root -d helali_database']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - helali-network

  redis:
    image: docker.arvancloud.ir/library/redis:7-alpine
    container_name: helali-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - helali_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - helali-network

  minio:
    image: docker.arvancloud.ir/minio/minio:RELEASE.2022-10-24T18-35-07Z
    container_name: helali-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio99
      MINIO_ROOT_PASSWORD: minio123
      MINIO_API_CORS_ALLOW_ORIGIN: '*'
    ports:
      - '9010:9000'
      - '9011:9001'
    volumes:
      - helali_minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - helali-network

volumes:
  helali_postgres_data:
  helali_redis_data:
  helali_minio_data:

networks:
  helali-network:
    name: helali-network
    driver: bridge
