services:
  postgres:
    image: postgres:16-alpine
    container_name: helali-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-helali_database}
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - helali_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-root}\" -d \"$${POSTGRES_DB:-helali_database}\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    networks:
      - helali-net

  redis:
    image: redis:7-alpine
    container_name: helali-redis
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --requirepass \"$${REDIS_PASSWORD}\" --appendonly yes --appendfsync everysec --maxmemory \"$${REDIS_MAXMEMORY:-128mb}\" --maxmemory-policy volatile-lru"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-128mb}
    volumes:
      - helali_redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - helali-net

  minio:
    image: minio/minio:RELEASE.2022-10-24T18-35-07Z
    container_name: helali-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minio99}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minio123}
      MINIO_API_CORS_ALLOW_ORIGIN: '*'
    ports:
      - "${MINIO_PUBLIC_PORT:-9010}:9000"
      - "${MINIO_CONSOLE_PORT:-9011}:9001"
    volumes:
      - helali_miniodata:/data
    # Scratch-based MinIO has no curl — never use --wait on this service.
    networks:
      - helali-net

  backend:
    image: ${BACKEND_IMAGE}
    container_name: helali-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3030}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-helali_database}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      BULLMQ_PREFIX: helali-prod
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-12h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-https://helali.rmhosseini.ir}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      COOKIE_SECURE: "false"
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-5.159.49.36}
      MINIO_PUBLIC_PORT: ${MINIO_PUBLIC_PORT:-9010}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minio99}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minio123}
      MINIO_USE_SSL: "false"
      STORAGE_DRIVER: minio
      API_ENCRYPTION_ENABLED: "false"
    volumes:
      - helali_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - helali-net

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: helali-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3031}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_URL: http://backend:3000/api/v1
      BACKEND_INTERNAL_ORIGIN: http://backend:3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://helali.rmhosseini.ir/api/v1}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://helali.rmhosseini.ir}
      MINIO_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-5.159.49.36}
      MINIO_PORT: ${MINIO_PUBLIC_PORT:-9010}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - helali-net

  nginx:
    image: nginx:1.27-alpine
    container_name: helali-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-3032}:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - helali-net

networks:
  helali-net:
    driver: bridge

volumes:
  helali_pgdata:
  helali_redisdata:
  helali_miniodata:
  helali_data:
